name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "healthme/backend/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: healthme-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: healthme-backend

jobs:
  build-test-deploy:
    name: Test, Build, Push and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: healthme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run backend tests
        working-directory: healthme/backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/healthme?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          DB_USERNAME: root
          DB_PASSWORD: testpassword
          JWT_SECRET: test-jwt-secret-for-context-load
          SQL_INIT_MODE: never
          APP_FRONTEND_URL: http://localhost:3000
          APP_BACKEND_URL: http://localhost:8090
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: healthme-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build \
            -t "$IMAGE_URI:$GITHUB_SHA" \
            -t "$IMAGE_URI:latest" \
            healthme/backend
          docker push "$IMAGE_URI:$GITHUB_SHA"
          docker push "$IMAGE_URI:latest"
          echo "image_uri=$IMAGE_URI:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/healthme.pem
          chmod 600 ~/.ssh/healthme.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          ssh -i ~/.ssh/healthme.pem \
            -o ConnectTimeout=15 \
            ubuntu@"$EC2_HOST" \
            "IMAGE_URI='$IMAGE_URI' AWS_REGION='$AWS_REGION' bash -s" <<'EOF'
          set -euo pipefail

          REGISTRY="${IMAGE_URI%%/*}"
          ENV_FILE="/home/ubuntu/healthme/.env"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          docker pull "$IMAGE_URI"

          # Validate the new image on 8091 before touching production.
          docker rm -f healthme-backend-candidate 2>/dev/null || true
          docker run -d \
            --name healthme-backend-candidate \
            --network host \
            --env-file "$ENV_FILE" \
            -e SERVER_PORT=8091 \
            "$IMAGE_URI"

          CANDIDATE_OK=false
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:8091; then
              CANDIDATE_OK=true
              break
            fi
            sleep 2
          done

          if [ "$CANDIDATE_OK" != "true" ]; then
            echo "Candidate container health check failed."
            docker logs --tail 200 healthme-backend-candidate || true
            docker rm -f healthme-backend-candidate || true
            exit 1
          fi

          OLD_IMAGE=$(docker inspect -f '{{.Config.Image}}' healthme-backend 2>/dev/null || true)
          docker rm -f healthme-backend-candidate
          docker rm -f healthme-backend 2>/dev/null || true

          docker run -d \
            --name healthme-backend \
            --restart unless-stopped \
            --network host \
            --env-file "$ENV_FILE" \
            "$IMAGE_URI"

          PRODUCTION_OK=false
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:8090; then
              PRODUCTION_OK=true
              break
            fi
            sleep 2
          done

          if [ "$PRODUCTION_OK" != "true" ]; then
            echo "Production health check failed. Rolling back."
            docker logs --tail 200 healthme-backend || true
            docker rm -f healthme-backend || true

            if [ -n "$OLD_IMAGE" ]; then
              docker run -d \
                --name healthme-backend \
                --restart unless-stopped \
                --network host \
                --env-file "$ENV_FILE" \
                "$OLD_IMAGE"
            fi
            exit 1
          fi

          docker image prune -f
          echo "Deployment completed successfully."
          EOF
