name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "healthme/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: healthme-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: healthme-backend

jobs:
  build-test-deploy:
    name: Test, Build, Push and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: healthme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run backend tests
        working-directory: healthme/backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/healthme?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          DB_USERNAME: root
          DB_PASSWORD: testpassword
          JWT_SECRET: test-jwt-secret-for-context-load
          SQL_INIT_MODE: never
          APP_FRONTEND_URL: http://localhost:3000
          APP_BACKEND_URL: http://localhost:8090
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: healthme-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build \
            -t "$IMAGE_URI:$GITHUB_SHA" \
            -t "$IMAGE_URI:latest" \
            healthme/backend
          docker push "$IMAGE_URI:$GITHUB_SHA"
          docker push "$IMAGE_URI:latest"
          echo "image_uri=$IMAGE_URI:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 with AWS SSM
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
          EC2_INSTANCE_ID: i-0dbd24cd6a0b6e508
        run: |
          jq -n \
            --arg image "$IMAGE_URI" \
            --arg region "$AWS_REGION" \
            '{
              commands: [
                "set -e",
                ("IMAGE_URI=" + $image),
                ("AWS_REGION=" + $region),
                "REGISTRY=${IMAGE_URI%%/*}",

                "aws ecr get-login-password --region \"$AWS_REGION\" | docker login --username AWS --password-stdin \"$REGISTRY\"",

                "docker pull \"$IMAGE_URI\"",

                "OLD_IMAGE=$(docker inspect -f \"{{.Config.Image}}\" healthme-backend 2>/dev/null || true)",

                "docker rm -f healthme-backend 2>/dev/null || true",

                "docker run -d --name healthme-backend --restart unless-stopped --network host --env-file /home/ubuntu/healthme/.env \"$IMAGE_URI\"",

                "for i in $(seq 1 45); do if curl -fsS -o /dev/null http://127.0.0.1:8090; then exit 0; fi; sleep 2; done",

                "docker logs --tail 200 healthme-backend || true",

                "docker rm -f healthme-backend || true",

                "if [ -n \"$OLD_IMAGE\" ]; then docker run -d --name healthme-backend --restart unless-stopped --network host --env-file /home/ubuntu/healthme/.env \"$OLD_IMAGE\"; fi",

                "exit 1"
              ]
            }' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Backend deployment succeeded"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "TimedOut" ] || \
               [ "$STATUS" = "Cancelled" ]; then

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID"

              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out"
          exit 1
